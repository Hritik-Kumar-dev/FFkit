[package]
name = "ffkit"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A terminal UI that teaches FFmpeg by showing its work"
license = "MIT OR Apache-2.0"
# Large media never ships on crates.io: user videos landing in tests/ and
# the rendered README demo stay local (demo.tape reproduces the GIF).
exclude = ["demo.gif", "tests/*.webm", "tests/*.mp4", "tests/*.mkv", "tests/*.mov"]

[[bin]]
name = "ffkit"
path = "src/main.rs"

[lib]
name = "ffkit"
path = "src/lib.rs"

[dependencies]
# Pinned 2026-09-17 against crates.io max stable versions (see DECISIONS.md).
ratatui = "0.30"
crossterm = "0.29"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt-multi-thread", "macros", "fs", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
which = "8"
directories = "6"
arboard = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tui-input = "0.15"
# Filmstrip block approximation (§10): decode thumbnails to average colors.
image = "0.25"
